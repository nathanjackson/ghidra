#
# OIDC config file for GhidraServer when operating in -a5 mode.
# This file must not contain client secrets. Register a public/native
# OAuth client with device authorization enabled.
#
# Required:
#   issuer     OpenID Provider issuer URL (https)
#   clientId   Public OAuth client identifier
#
# Discovery fetches issuer/.well-known/openid-configuration at startup
# unless jwksFile, deviceAuthorizationEndpoint, and tokenEndpoint are all set
# (air-gapped operation). Discovery must advertise device_authorization_endpoint.
#

issuer=
clientId=

# Claim used first when mapping an ID token to a Ghidra user name.
usernameClaim=preferred_username

# Additional claims tried in order when usernameClaim does not sanitize to a
# valid Ghidra user name. For email values, the local-part before '@' is used.
usernameClaimFallbacks=email,sub

# User names are always lowercased.
usernameTransform=lowercase

# openid is required and is added automatically if omitted.
scopes=openid profile

# Seconds allowed to complete a device-code login (callback TTL).
loginTimeoutSeconds=900

# Maximum age of the ID token iat claim, in seconds.
maxTokenAgeSeconds=600

# Clock skew applied to exp / nbf / iat, in seconds.
clockSkewSeconds=60

# Allowed ID token signing algorithms.
allowedSigningAlgs=RS256,ES256

# Accepted audience; defaults to clientId when left blank.
audience=

# Optional JWKS overrides. Remote JWKS URLs must be https.
# jwksUri=
# jwksFile=

# Optional endpoint overrides. Required together with jwksFile for air-gapped
# operation (skips discovery). URLs must be https.
# deviceAuthorizationEndpoint=
# tokenEndpoint=

# Optional claim constraints. When set, the ID token must contain a matching
# tid (Azure AD tenant) or hd (Google hosted domain) claim.
# tenantId=
# hostedDomain=

# Optional display name shown to clients.
# displayName=

// Native build files are already applied in development mode (indicated by presence of the
// Generic project).  Only need to apply them if we are in a distribution.
if (findProject(':Generic') == null) {
	// running from within Ghidra install
	apply from: "../../../GPL/utils.gradle"
	apply from: "../../../GPL/nativePlatforms.gradle"
	apply from: "../../../GPL/nativeBuildProperties.gradle"
}

ext.LIBFIDO2_DISTRO = "libfido2-1.17.0.tar.gz"
ext.LIBCBOR_DISTRO = "libcbor-0.12.0.tar.gz"
ext.OPENSSL_DISTRO = "openssl-3.5.8.tar.gz"

def findFidoTarball = { String name ->
	def candidates = []
	try {
		candidates << file("${rootProject.DEPS_DIR}/FileSystem/${name}")
	}
	catch (Exception e) {
		// DEPS_DIR is only set in a full Ghidra build
	}
	try {
		candidates << file("${rootProject.BIN_REPO}/Ghidra/Framework/FileSystem/${name}")
	}
	catch (Exception e) {
		// BIN_REPO is only set in a full Ghidra build
	}
	candidates << file("${projectDir}/src/fido/vendor/${name}")
	return candidates.find { it != null && it.isFile() }
}

def fidoSrcDir = file("${buildDir}/fido-src")
def fidoPrefixRoot = file("${buildDir}/fido-prefix")
def fidoDepsScript = file("${projectDir}/src/fido/build-fido-deps.sh")

def fidoUnixPlatforms = []
if (isCurrentMac()) {
	fidoUnixPlatforms = ["mac_x86_64", "mac_arm_64"]
}
else if (isCurrentLinux() || isCurrentFreeBSD() || isCurrentOpenBSD()) {
	fidoUnixPlatforms = [getCurrentPlatformName()]
}

def requireFidoTarballs = {
	def missing = [LIBFIDO2_DISTRO, LIBCBOR_DISTRO]
	if (isCurrentMac()) {
		missing << OPENSSL_DISTRO
	}
	def absent = missing.findAll { findFidoTarball(it) == null }
	if (!absent.isEmpty()) {
		throw new GradleException(
			"Missing vendored FIDO tarball(s): ${absent.join(', ')}.\n" +
			"Run: gradle -I gradle/support/fetchDependencies.gradle init")
	}
}

task unpackFidoDeps {
	description = "Unpack libfido2 / libcbor / OpenSSL sources for the helper"
	outputs.dir fidoSrcDir
	doFirst {
		requireFidoTarballs()
	}
	doLast {
		mkdir fidoSrcDir
		[LIBFIDO2_DISTRO, LIBCBOR_DISTRO].each { name ->
			copy {
				from tarTree(findFidoTarball(name))
				into fidoSrcDir
			}
		}
		if (isCurrentMac()) {
			copy {
				from tarTree(findFidoTarball(OPENSSL_DISTRO))
				into fidoSrcDir
			}
		}
	}
}

fidoUnixPlatforms.each { plat ->
	def prefix = file("${fidoPrefixRoot}/${plat}")
	task "buildFidoDeps_${plat}"(type: Exec) {
		description = "Build static libfido2 for ${plat}"
		dependsOn unpackFidoDeps
		inputs.dir fidoSrcDir
		inputs.file fidoDepsScript
		outputs.file "${prefix}/lib/libfido2.a"
		workingDir projectDir
		commandLine "sh", fidoDepsScript.absolutePath, prefix.absolutePath,
			fidoSrcDir.absolutePath, plat
	}
}

def fidoTaskToken = { String platform ->
	def parts = platform.split("_") as List
	parts[0] = parts[0].capitalize()
	return parts.join("_")
}

tasks.whenTaskAdded { t ->
	if (!t.name.startsWith("linkGhidraFido")) {
		return
	}
	fidoUnixPlatforms.each { plat ->
		if (t.name.contains(fidoTaskToken(plat))) {
			t.dependsOn "buildFidoDeps_${plat}"
			if (plat == getCurrentPlatformName()) {
				t.finalizedBy checkGhidraFidoLinkage
				checkGhidraFidoLinkage.dependsOn t
			}
		}
	}
}

def fidoPrefixFor = { String platformName ->
	return file("${fidoPrefixRoot}/${platformName}")
}

model {
	components {
		ghidraFido(NativeExecutableSpec) {
			baseName "ghidra-fido"

			targetPlatform "win_x86_64"
			targetPlatform "win_arm_64"
			targetPlatform "linux_x86_64"
			targetPlatform "linux_arm_64"
			targetPlatform "mac_x86_64"
			targetPlatform "mac_arm_64"
			targetPlatform "freebsd_x86_64"
			targetPlatform "freebsd_arm_64"
			targetPlatform "openbsd_x86_64"
			targetPlatform "openbsd_arm_64"

			sources {
				c {
					source {
						srcDir "src/fido"
						include "ghidra-fido.c"
						include "ghidra-fido-json.c"
					}
				}
			}
		}
	}

	binaries {
		all { b ->
			if (b.toolChain in Gcc) {
				b.cCompiler.args "-std=c99"
				b.cCompiler.args "-Wall"
				b.cCompiler.args "-O2"
				if (b.targetPlatform.operatingSystem.linux ||
					b.targetPlatform.operatingSystem.name == "freebsd" ||
					b.targetPlatform.operatingSystem.name == "openbsd") {
					if (b.targetPlatform.operatingSystem.linux) {
						b.cCompiler.define "LINUX"
						b.cCompiler.define "_LINUX"
					}
					def prefix = fidoPrefixFor(b.targetPlatform.name)
					b.cCompiler.args "-I${prefix}/include"
					b.linker.args "${prefix}/lib/libfido2.a"
					b.linker.args "${prefix}/lib/libcbor.a"
					b.linker.args "-lcrypto"
					b.linker.args "-lz"
					b.linker.args "-lpthread"
					if (b.targetPlatform.operatingSystem.linux) {
						b.linker.args "-ludev"
					}
				}
			}
			else if (b.toolChain in VisualCpp) {
				if (b.targetPlatform.operatingSystem.windows) {
					b.cCompiler.define "WINDOWS"
					b.cCompiler.define "_WINDOWS"
					b.cCompiler.define "WIN32"
					b.cCompiler.define "_WIN32"
					if (b.targetPlatform.name == "win_x86_64") {
						b.cCompiler.define "WIN64"
						b.cCompiler.define "_WIN64"
					}
					b.linker.args "webauthn.lib"
				}
				b.cCompiler.args "/O2"
			}
			else if (b.toolChain in Clang) {
				b.cCompiler.args "-Wall"
				b.cCompiler.args "-O2"
				b.cCompiler.args "-std=c99"
				def osName = b.targetPlatform.operatingSystem.name
				def platformName = b.targetPlatform.name
				def useLibfido2 = osName == "osx" || b.targetPlatform.operatingSystem.linux ||
					osName == "freebsd" || osName == "openbsd"
				if (useLibfido2) {
					def prefix = fidoPrefixFor(platformName)
					b.cCompiler.args "-I${prefix}/include"
					b.linker.args "${prefix}/lib/libfido2.a"
					b.linker.args "${prefix}/lib/libcbor.a"
					if (osName == "osx") {
						b.linker.args "${prefix}/lib/libcrypto.a"
						b.linker.args "-lz"
						b.linker.args "-framework"
						b.linker.args "IOKit"
						b.linker.args "-framework"
						b.linker.args "CoreFoundation"
					}
					else {
						b.linker.args "-lcrypto"
						b.linker.args "-lz"
						b.linker.args "-lpthread"
						if (b.targetPlatform.operatingSystem.linux) {
							b.linker.args "-ludev"
						}
					}
				}
				if (osName == "freebsd") {
					b.cCompiler.define "_XOPEN_SOURCE", "600"
				}
			}
		}
	}
}

task checkGhidraFidoLinkage {
	description = "Fail if ghidra-fido still links a system libfido2"
	doLast {
		def platform = getCurrentPlatformName()
		def bin = file("${buildDir}/os/${platform}/ghidra-fido")
		if (!bin.isFile()) {
			bin = file("${buildDir}/os/${platform}/ghidra-fido.exe")
		}
		if (!bin.isFile()) {
			logger.warn("ghidra-fido not built for ${platform}; skipping linkage check")
			return
		}
		if (isCurrentWindows()) {
			return
		}
		def proc
		if (isCurrentMac()) {
			proc = ["otool", "-L", bin.absolutePath].execute()
		}
		else {
			proc = ["ldd", bin.absolutePath].execute()
		}
		proc.waitFor()
		def out = proc.text
		logger.lifecycle(out)
		if (out.contains("libfido2")) {
			throw new GradleException("ghidra-fido still links libfido2:\n${out}")
		}
		if (isCurrentMac()) {
			if (out.contains("libcrypto") || out.contains("/opt/homebrew") ||
				out.contains("libcbor")) {
				throw new GradleException("ghidra-fido has disallowed dylibs:\n${out}")
			}
		}
	}
}

gradle.taskGraph.whenReady { graph ->
	graph.allTasks.each { t ->
		if (t.name == "buildNatives" || t.name.startsWith("buildNatives_")) {
			t.finalizedBy checkGhidraFidoLinkage
		}
	}
}
